<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOVRN Technologies — Modern Technology. Without the Commitment.">
  <title>SOVRN Technologies</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page" id="top">
    <img class="design" src="assets/sovrn-final-homepage.png" alt="SOVRN Technologies website">

    <!-- Header navigation -->
    <a class="hotspot home" href="#top" aria-label="Home"></a>
    <a class="hotspot residential" href="#protect" aria-label="Residential"></a>
    <a class="hotspot commercial" href="#why" aria-label="Commercial"></a>
    <a class="hotspot services" href="#solutions" aria-label="Services"></a>
    <a class="hotspot about" href="#why" aria-label="About"></a>
    <a class="hotspot contact-link" href="#contact" aria-label="Contact"></a>
    <a class="hotspot top-cta" href="#contact" aria-label="Request consultation"></a>
    <a class="hotspot hero-cta" href="#contact" aria-label="Request a consultation"></a>

    <!-- Solution links -->
    <a class="hotspot sol-1" href="#contact" aria-label="Video surveillance"></a>
    <a class="hotspot sol-2" href="#contact" aria-label="Security systems"></a>
    <a class="hotspot sol-3" href="#contact" aria-label="Access control"></a>
    <a class="hotspot sol-4" href="#contact" aria-label="Network technologies"></a>
    <a class="hotspot sol-5" href="#contact" aria-label="Smart home"></a>
    <a class="hotspot sol-6" href="#contact" aria-label="Commercial security"></a>

    <!-- Invisible anchors aligned to the approved design -->
    <span id="protect" class="anchor anchor-protect"></span>
    <span id="solutions" class="anchor anchor-solutions"></span>
    <span id="why" class="anchor anchor-why"></span>
    <span id="contact" class="anchor anchor-contact"></span>

    <!-- Interactive form overlays positioned over the form in the artwork -->
    <form id="quoteForm" class="form-overlay">
      <input name="name" aria-label="Full name" placeholder="Full Name" required>
      <input name="phone" aria-label="Phone number" placeholder="Phone Number">
      <input name="email" type="email" aria-label="Email address" placeholder="Email Address" required>

      <select name="customer_type" aria-label="Residential or Commercial">
        <option value="">Residential or Commercial</option>
        <option>Residential</option>
        <option>Commercial</option>
      </select>

      <select name="property_type" aria-label="Property Type">
        <option value="">Property Type</option>
        <option>Home</option>
        <option>Office</option>
        <option>Retail</option>
        <option>Warehouse</option>
        <option>Facility</option>
      </select>

      <select name="service" aria-label="Services Needed">
        <option value="">Services Needed</option>
        <option>Video Surveillance</option>
        <option>Security Systems</option>
        <option>Access Control</option>
        <option>Network Technologies</option>
        <option>Smart Home</option>
        <option>Commercial Security</option>
      </select>

      <select name="budget" aria-label="Approximate Budget">
        <option value="">Approximate Budget</option>
        <option>Under $2,500</option>
        <option>$2,500–$5,000</option>
        <option>$5,000–$10,000</option>
        <option>$10,000+</option>
      </select>

      <textarea name="message" aria-label="Project Description" placeholder="Project Description"></textarea>
      <button type="submit" aria-label="Submit request"></button>
    </form>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
